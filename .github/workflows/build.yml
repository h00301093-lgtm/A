
name: Build APK

# Compila l'APK nel cloud di GitHub: non serve installare Android Studio.
on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Estrai il progetto dallo zip
        run: |
          Z=$(ls *.zip | head -1)
          ./gradlew --no-daemon :app:assembleDebug
          Z=$(ls *.zip | head -1)
          unzip -q -o "$Z" -d src
          P=$(dirname "$(find src -name settings.gradle.kts | head -1)")
          echo "Progetto trovato in: $P"
          echo "PROJ=$P" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJ" :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LongScreen-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
