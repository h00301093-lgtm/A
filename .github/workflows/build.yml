
name: Build APK

# Compila l'APK nel cloud di GitHub: non serve installare Android Studio.
on:
  workflow_dispatch:
  push:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Estrai il progetto dallo zip
        shell: python
        run: |
          import glob, os, zipfile, sys
          print("File nel repository:", os.listdir("."))
          zips = glob.glob("/*.zip", recursive=True)
          if not zips:
              sys.exit("ERRORE: nessun file .zip trovato nel repository")
          print("Zip usato:", zips[0])
          zipfile.ZipFile(zips[0]).extractall("src")
          found = glob.glob("src//settings.gradle.kts", recursive=True)
          if not found:
              sys.exit("ERRORE: nello zip non c'è settings.gradle.kts")
          proj = os.path.dirname(found[0])
          print("Progetto trovato in:", proj)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write("PROJ=" + proj + "\n")
      - name: Build debug APK
        run: gradle --no-daemon -p "$PROJ" :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LongScreen-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
